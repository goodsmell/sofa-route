<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="한샘 소파 배송 사진으로 순서를 만들고 현장에서 조정하는 도구">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <script>
    // T맵 Raster SDK는 내부 스크립트를 document.write로 읽으므로 파싱 중에 로드해야 한다.
    try {
      const tmapKey = localStorage.getItem('sofa-route-tmap-key-v1');
      if (tmapKey) {
        document.write('<script id="tmap-sdk" src="https://apis.openapi.sk.com/tmap/jsv2?version=1&amp;appKey=' + encodeURIComponent(tmapKey) + '" onerror="window.__tmapSdkLoadError=true"><\/script>');
      }
    } catch (_) {}
  </script>
  <title>아빠 화이팅</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
